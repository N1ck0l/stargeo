# Lint, typecheck e testes em todo push e pull request.
#
# A Netlify já roda `npm run verificar` antes de publicar (ver netlify.toml);
# isto aqui é para o vermelho aparecer no GitHub — no commit e no PR — sem
# precisar abrir o log de deploy.
name: verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # As mesmas variáveis que o build da Netlify tem (valores fictícios): um
    # teste que só passa SEM elas passou aqui e travou o deploy lá.
    env:
      VITE_SUPABASE_URL: https://exemplo.supabase.co
      VITE_SUPABASE_ANON_KEY: chave-de-teste
      VITE_FUNCTIONS_URL: https://exemplo.supabase.co/functions/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verificar
      - run: npm run build
