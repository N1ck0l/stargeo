<!--
  HTML raiz da LOJA — não do site pessoal (que tem o seu `index.html` na
  raiz do repositório, com build próprio).

  Entry do Vite da loja (`loja/vite.config.js`, `npm run dev:loja`). Duas
  peculiaridades deste arquivo, documentadas nos comentários abaixo: o
  `meta.js` que injeta as URLs absolutas de prévia social, e o `src` do
  bundle RELATIVO ao `loja/`, porque o `root` do Vite da loja é a raiz do
  repositório.
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Dedique uma estrela no céu do Brasil a quem você ama: coordenadas reais conferidas com o SIMBAD e certificado por e-mail em minutos."
    />
    <title>Stellara · Dedique uma estrela no céu do Brasil</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#090b20" />

    <!--
      A prévia ao compartilhar depende do domínio real, então estas URLs são
      trocadas por um script em tempo de build. Ver `loja/public/meta.js`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Stellara" />
    <meta property="og:title" content="Dedique uma estrela no céu do Brasil" />
    <meta
      property="og:description"
      content="Certificado de estrela com coordenadas reais, com o nome de quem você ama. Entregue por e-mail em minutos."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fonte pré-carregada: é a do título, e aparece no primeiro paint. Sem
      isso o texto renderiza na fonte de sistema e depois troca — o "flash"
      que mais aparece numa loja. Playfair e Montserrat são variáveis: um
      arquivo por família cobre a faixa de pesos declarada em `fonts.css`.
    -->
    <link rel="preload" href="/fonts/playfair-display-400-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/montserrat-400-600.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Caminho a partir da RAIZ, de propósito: `./meta.js` resolve contra a URL
      atual, e numa rota como `/produto/kaus-australis` viraria
      `/produto/meta.js` — que não existe. Na Vercel isso ainda devolveria o
      index (200) no lugar do JS, e a prévia social ficaria sem URL.
    -->
    <script src="/meta.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; font-family: Georgia, serif; line-height: 1.7">
        <h1 style="font-size: 2rem">Stellara</h1>
        <p style="margin-top: 1rem">
          Esta loja usa JavaScript para mostrar a prévia do certificado antes da compra. Ative o
          JavaScript, ou fale com a gente pelo e-mail e a gente monta o certificado à mão.
        </p>
      </div>
    </noscript>
    <!--
      Caminho RELATIVO de propósito. Com `/src/main.jsx`, a barra inicial
      resolveria a partir da raiz do repositório e traria o `main.jsx` do site
      pessoal — que compila sem erro e produz uma loja que não funciona.
      Relativo, o Vite sempre acha o arquivo certo.

      (Isto é HTML, não JSX: `{/* ... */}` aqui seria TEXTO na página — e foi.
      O comentário tem que ser de HTML.)
    -->
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
