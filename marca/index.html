<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellara — marca</title>
<style>
  body{margin:0;background:#090B20;color:#F6F1E7;font:14px/1.5 system-ui,sans-serif}
  main{max-width:1100px;margin:auto;padding:32px 16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  figure{margin:0;border:1px solid #ffffff1f;border-radius:12px;overflow:hidden}
  figure div{display:grid;place-items:center;padding:32px;min-height:220px}
  figure img{max-width:100%;max-height:200px}
  .escuro div{background:#090B20} .claro div{background:#F6F1E7}
  figcaption{padding:8px 12px;font-family:ui-monospace,monospace;font-size:12px;opacity:.7}
</style></head><body><main>
<figure class="escuro"><div><img src="stellara-simbolo.svg" alt=""></div><figcaption>stellara-simbolo.svg</figcaption></figure>
<figure class="escuro"><div><img src="stellara-horizontal.svg" alt=""></div><figcaption>stellara-horizontal.svg</figcaption></figure>
<figure class="escuro"><div><img src="stellara-vertical.svg" alt=""></div><figcaption>stellara-vertical.svg</figcaption></figure>
<figure class="escuro"><div><img src="stellara-simbolo-mono-marfim.svg" alt=""></div><figcaption>stellara-simbolo-mono-marfim.svg</figcaption></figure>
<figure class="escuro"><div><img src="stellara-horizontal-mono-marfim.svg" alt=""></div><figcaption>stellara-horizontal-mono-marfim.svg</figcaption></figure>
<figure class="escuro"><div><img src="stellara-vertical-mono-marfim.svg" alt=""></div><figcaption>stellara-vertical-mono-marfim.svg</figcaption></figure>
<figure class="claro"><div><img src="stellara-simbolo-mono-noite.svg" alt=""></div><figcaption>stellara-simbolo-mono-noite.svg</figcaption></figure>
<figure class="claro"><div><img src="stellara-horizontal-mono-noite.svg" alt=""></div><figcaption>stellara-horizontal-mono-noite.svg</figcaption></figure>
<figure class="claro"><div><img src="stellara-vertical-mono-noite.svg" alt=""></div><figcaption>stellara-vertical-mono-noite.svg</figcaption></figure>
<figure class="escuro"><div><img src="stellara-simbolo-reduzido.svg" alt=""></div><figcaption>stellara-simbolo-reduzido.svg</figcaption></figure>
<figure class="escuro" style="grid-column:1/-1"><div style="display:flex;gap:28px;align-items:center;justify-content:center;min-height:120px">
<img src="stellara-simbolo-reduzido.svg" width="16" height="16" alt=""><img src="stellara-simbolo-reduzido.svg" width="24" height="24" alt=""><img src="stellara-simbolo-reduzido.svg" width="32" height="32" alt=""><img src="stellara-simbolo-reduzido.svg" width="48" height="48" alt="">
<img src="../loja/public/favicon.svg" width="32" height="32" alt="" onerror="this.remove()">
</div><figcaption>versão reduzida em 16, 24, 32 e 48 px (cabeçalho, rodapé, favicon)</figcaption></figure>
</main></body></html>
