# Configuração da Netlify — site `stellara-loja`, conectado ao repositório
# N1ck0l/stellara: commit com push na `main` é deploy.

[build]
  # `verificar` (lint + typecheck + testes) ANTES do build: commit com push é
  # deploy, e sem isto um teste vermelho ia para o ar do mesmo jeito. Se
  # falhar, a Netlify mantém no ar a última versão boa.
  command = "npm run verificar && npm run build"
  publish = "dist-loja"
  # Pula o build (e o crédito de deploy) quando o push só mexe no que NÃO vai
  # para o site: documentação, testes, CI, Supabase (publicado por
  # `npm run publicar:supabase`) e scripts de manutenção. `git diff --quiet`
  # sai com 0 quando nada fora dessa lista mudou desde o último deploy — e
  # 0 é "pode pular". Sem deploy anterior em cache, o diff falha e o build
  # roda (o seguro). O lint e os testes continuam no CI do GitHub.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)test/' ':(exclude)shared/*.test.mjs' ':(exclude).github/' ':(exclude)supabase/' ':(exclude)scripts/gerar-*.mjs' ':(exclude)scripts/carregar-catalogo.mjs' ':(exclude)scripts/publicar-supabase.mjs' ':(exclude)marca/' ':(exclude).gitignore'"

[build.environment]
  # Vite 8 exige Node 20.19+ ou 22.12+; 20 genérico poderia pegar uma versão
  # velha demais e falhar no build.
  NODE_VERSION = "22"

# A loja usa rotas de caminho (/produto/..., /rastrear, /obrigado), que não
# existem como arquivo — a regra devolve o index.html para qualquer caminho
# inexistente. O mesmo resultado já está no `_redirects` da pasta public da
# loja (que vai para dist-loja/); manter os dois é inofensivo e cobre quem
# copiar só um.
# O produto tem HTML próprio, com o título já pintado no build
# (`scripts/prerender-produto.mjs`). Antes da regra geral.
[[redirects]]
  from = "/produto/*"
  to = "/produto.html"
  status = 200

# As outras telas: o HTML vazio (`app.html`). O `index.html` é a HOME já
# desenhada, e a Netlify o serve em `/` por ser arquivo.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Cabeçalhos de segurança e cache.
#
# Blocos de cabeçalho são CUMULATIVOS na Netlify: um pedido casa com todos os
# `for` aplicáveis, e só em caso de cabeçalho repetido o mais específico
# vence. Então o `/*` de segurança lá embaixo vale até para `/assets/*`; os
# blocos abaixo só acrescentam o Cache-Control próprio de cada pasta.
[[headers]]
  for = "/assets/*"
  [headers.values]
    # Os assets do Vite levam hash no nome: o arquivo só muda se o caminho
    # mudar. `immutable` é o que permite o ano inteiro de max-age sem risco de
    # servir versão velha.
    Cache-Control = "public, max-age=31536000, immutable"

# As fontes não levam hash no nome (ficam em /fonts), então valem um prazo
# menor, mas ainda bem maior que o padrão.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Páginas de presente (/p/ das estrelas e homenagens, /g/ dos grupos): nunca
# no índice dos buscadores. O `robots.txt` já pede para não rastrear; este
# cabeçalho cobre o caso de alguém publicar o link (o buscador chega por fora).
# Não é sigilo: quem tem o link vê a página.
[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/g/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/*"
  [headers.values]
    # Impede que o navegador "aja como" outro tipo além do declarado —
    # protege contra MIME sniffing de uploads.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SAMEORIGIN em vez de DENY: nenhuma página embute a loja hoje, mas
    # DENY também bloqueia iframes da própria origem, e um iframe interno
    # (ex.: preview futuro) quebraria sem nenhum ganho de segurança externo.
    X-Frame-Options = "SAMEORIGIN"
    # Câmera, localização e sensores de orientação só para a própria origem:
    # a Mira celeste da página dedicada usa os três. Microfone ninguém usa,
    # então fica fechado. (`ambient-light-sensor` saiu: o Chrome não reconhece
    # mais o nome e reclamava no console de toda página.)
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
    # 604800 s = 7 dias. Curto de propósito: HSTS com includeSubDomains é
    # difícil de desfazer (o navegador recusa HTTP por esse tempo em TODOS os
    # subdomínios), então o primeiro passo é pequeno e só depois se sobe.
    Strict-Transport-Security = "max-age=604800; includeSubDomains"
    # CSP: a loja só carrega código e dados da própria origem e do Supabase
    # (functions, Data API e auth do painel); o Mercado Pago é navegação, que
    # a CSP não restringe. `style-src 'unsafe-inline'` é pelos estilos que o
    # React e o html-to-image (PNG do certificado) escrevem inline; `data:` e
    # `blob:` são o PNG gerado e o vídeo da câmera na Mira.
    #
    # Testada em modo bloqueante antes de ativar (14/10): home, produto,
    # /p/CODE com get-page, certificado e PNG, /admin — zero violações.
    # Se um recurso novo de outro domínio entrar na loja, ele tem de entrar
    # aqui também, ou o navegador o bloqueia.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
