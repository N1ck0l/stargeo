# Configuração da Netlify.
#
# Atenção a quem lê isto: existem DOIS sites com formas de publicar diferentes.
#
#  1. O SITE PESSOAL (o presente): é publicado arrastando a pasta `dist/` no
#     Netlify Drop (ver DEPLOY.md). O Drop não lê este arquivo — ele só existe
#     na raiz do repositório, que não está conectado a esse site. Por isso nada
#     daqui afeta o presente.
#
#  2. A LOJA: este arquivo é dela. Conecte o repositório ao Netlify (Import an
#     existing project → GitHub → N1ck0l/stargeo) e o build sai daqui.
#
# As regras de segurança e cache valem para qualquer um dos dois; só o
# comando de build é específico da loja.

[build]
  command = "npm run build:loja"
  publish = "dist-loja"

[build.environment]
  # Vite 8 exige Node 20.19+ ou 22.12+; 20 genérico poderia pegar uma versão
  # velha demais e falhar no build.
  NODE_VERSION = "22"

# A loja usa rotas de caminho (/produto/..., /rastrear, /obrigado), que não
# existem como arquivo — a regra devolve o index.html para qualquer caminho
# inexistente. O mesmo resultado já está no `_redirects` da pasta public da
# loja (que vai para dist-loja/); manter os dois é inofensivo e cobre quem
# copiar só um.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança e cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# As fontes não levam hash no nome (ficam em /fonts), então valem um prazo
# menor, mas ainda bem maior que o padrão.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Só a própria origem pode usar câmera, microfone, localização e sensores
    # de orientação — a loja não usa nenhum, mas restringir custa nada.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), ambient-light-sensor=()"
    Strict-Transport-Security = "max-age=604800; includeSubDomains"
