# Configuração local do Supabase.
#
# Gerada para o CLI. Só o que importa para este projeto está aqui; o resto usa
# o padrão.
#
# Vale para o stack LOCAL (`supabase start` / `functions serve`). Em produção
# o que decide é o `supabase functions deploy --no-verify-jwt` de `LOJA.md` e
# as variáveis de `supabase secrets set`.

# Nome do projeto local: vira o prefixo dos containers e volumes que o CLI
# cria (stargeo-db, stargeo-rest e companhia).
project_id = "stargeo"

[api]
enabled = true
# Schemas expostos pelo Data API. Expor `public` não vira leitura de `orders`:
# a tabela não tem política de RLS (ver `0001_loja.sql`), então o `anon` não
# enxerga nenhuma linha, mesmo com a chave pública em mãos.
schemas = ["public", "storage_graphql"]
# Esquemas procurados quando um nome chega sem qualificação. `extensions` é
# onde o Supabase instala as extensões (`citext`, `pgcrypto`), então funções e
# tipos delas funcionam sem escrever o esquema na frente.
extra_search_path = ["public", "extensions"]
# Teto de linhas por resposta REST — trava de fábrica contra consulta mal
# escrita que tente puxar a tabela inteira num GET.
max_rows = 1000

[db]
# Porta local do Postgres (127.0.0.1:54322). Nada a ver com a porta 5432 da
# instalação do sistema — é o CLI do Supabase que a escolhe.
port = 54322
# Postgres 17. O `citext` (e-mail sem distinção de caixa, usado em
# `orders.customer_email` e `pages.customer_email`) já acompanha esta versão —
# `0001_loja.sql` só precisa do `create extension`.
major_version = 17

[db.migrations]
# Vazio = o CLI aplica tudo que está em `supabase/migrations/`, em ordem de
# nome de arquivo. Só se preenche se as migrations viverem fora da pasta.
schema_paths = []

[storage]
enabled = true
# Teto por arquivo. Sobra folga para o PDF (~24 KB) e impede que o bucket
# vire disco de arquivo do projeto.
file_size_limit = "50MiB"

# ---------------------------------------------------------------------------
# Edge Functions
#
# TODAS as funções têm seção aqui, para FIXAR o `verify_jwt` de cada uma: o
# padrão do CLI é `true`, e um deploy que esquecesse o `--no-verify-jwt` faria
# o gateway barrar com 401 quem chama sem JWT — o navegador da loja, o login de
# edição, o Mercado Pago. Com a seção, `supabase functions deploy` acerta
# sozinho, com ou sem flag.
# ---------------------------------------------------------------------------
[functions.get-page]
# Página pública: quem abre `/p/CODE` não tem conta. Só devolve `published`.
verify_jwt = false

[functions.page-auth]
# É o LOGIN da edição, então não pode exigir um. A proteção é o par código +
# e-mail (ou o link por e-mail), com limite de tentativas.
verify_jwt = false

[functions.page-update]
# Autentica pelo token de edição próprio (`page_edit_tokens`), não por JWT.
verify_jwt = false

[functions.admin-api]
# Recebe o JWT do Supabase Auth do painel, mas confere ela mesma
# (`auth.getUser` + linha em `admins`) — o gateway não sabe da lista branca.
verify_jwt = false

[functions.create-checkout]
# Chamada pelo navegador durante o checkout. Precisa do JWT desligado porque
# o visitante não está autenticado — é o preço no servidor que protege a
# operação, não a autenticação.
verify_jwt = false

[functions.track-order]
# Idem: o rastreamento é público por definição, protegido por código + e-mail.
verify_jwt = false

[functions.mp-webhook]
# O Mercado Pago não tem token da nossa conta: ele manda uma assinatura HMAC no
# header `x-signature`, e é ela que é conferida no código. Com o JWT ligado, o
# Mercado Pago receberia 401 e nenhum webhook jamais chegaria.
verify_jwt = false

[functions.resend-certificate]
# Esta EXIGE autenticação: dispara e-mail para o cliente e lê pedido. Nunca
# chamar do navegador. O `verify_jwt` aqui é só a primeira porta — a chave anon
# também é um JWT válido do projeto. A função confere DENTRO dela que o Bearer
# é a service_role (`ehServiceRole`), que só o `admin-api` tem.
verify_jwt = true

[functions.testimonial]
# Depoimento do comprador: autenticado pelo token de edição do `page-auth`,
# conferido dentro da função (como o `page-update`).
verify_jwt = false
